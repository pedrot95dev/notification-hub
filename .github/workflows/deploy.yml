# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Check for vulnerable packages
      run: |
        set -o pipefail
        dotnet list package --vulnerable --include-transitive | tee vuln.txt
        if grep -E "has the following vulnerable packages" vuln.txt; then
          echo "Vulnerable packages found."
          exit 1
        fi
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --nologo

  build-push-docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        # Same build, both registries. Docker Hub keeps its existing name.
        images: |
          pedrodev95/notification-hub
          ghcr.io/pedrot95dev/notification-hub
        # Disable the automatic latest tag. latest is the explicit raw tag below.
        flavor: |
          latest=false
        tags: |
          type=raw,value=0.1.${{ github.run_number }},priority=300
          type=sha,format=short,prefix=sha-
          type=raw,value=latest
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=0.1.${{ github.run_number }}
    - name: Check image tags and labels
      env:
        DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
        DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        VERSION_TAG: 0.1.${{ github.run_number }}
      run: |
        set -euo pipefail
        hub_image=pedrodev95/notification-hub
        ghcr_image=ghcr.io/pedrot95dev/notification-hub
        short_sha=${GITHUB_SHA:0:7}
        expected=$(printf '%s\n' \
          "${hub_image}:${VERSION_TAG}" \
          "${hub_image}:sha-${short_sha}" \
          "${hub_image}:latest" \
          "${ghcr_image}:${VERSION_TAG}" \
          "${ghcr_image}:sha-${short_sha}" \
          "${ghcr_image}:latest" | sort)
        actual=$(printf '%s\n' "$DOCKER_TAGS" | sed '/^$/d' | sort)
        if [ "$expected" != "$actual" ]; then
          echo "Unexpected Docker tags." >&2
          echo "Expected:" >&2
          printf '%s\n' "$expected" >&2
          echo "Actual:" >&2
          printf '%s\n' "$actual" >&2
          exit 1
        fi
        require_label() {
          if ! printf '%s\n' "$DOCKER_LABELS" | grep -Fxq "$1"; then
            echo "Missing label: $1" >&2
            printf '%s\n' "$DOCKER_LABELS" >&2
            exit 1
          fi
        }
        require_label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
        require_label "org.opencontainers.image.revision=${GITHUB_SHA}"
        require_label "org.opencontainers.image.version=${VERSION_TAG}"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login on Docker registry
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push the Docker image
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        # Keep a single image manifest, same as the previous docker push, so the
        # tag digest is the image itself.
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Write the version tags and digests to the job summary
      env:
        IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        VERSION_TAG: 0.1.${{ github.run_number }}
      run: |
        set -euo pipefail
        if [ -z "$IMAGE_DIGEST" ]; then
          echo "Build did not return an image digest." >&2
          exit 1
        fi
        # Read the tag digest each registry stored. One build is pushed to both;
        # these two values are what a compare or a pin uses.
        registry_digest() {
          local ref="$1"
          local raw digest
          if ! raw=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$ref"); then
            echo "Could not inspect ${ref}." >&2
            return 1
          fi
          digest=${raw#\"}
          digest=${digest%\"}
          digest=${digest//$'\n'/}
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            digest=$(printf '%s\n' "$raw" | awk '/^Digest:/ { print $2; exit }')
          fi
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "No digest for ${ref}." >&2
            printf '%s\n' "$raw" >&2
            return 1
          fi
          printf '%s\n' "$digest"
        }
        hub_image=pedrodev95/notification-hub
        ghcr_image=ghcr.io/pedrot95dev/notification-hub
        hub_digest=$(registry_digest "${hub_image}:${VERSION_TAG}") || exit 1
        ghcr_digest=$(registry_digest "${ghcr_image}:${VERSION_TAG}") || exit 1
        if [ "$hub_digest" = "$ghcr_digest" ]; then
          digest_compare="Digests match."
        else
          digest_compare="Digests differ."
        fi
        {
          echo "### Docker image"
          echo ""
          echo "#### Docker Hub"
          echo ""
          echo "- Version tag: \`${hub_image}:${VERSION_TAG}\`"
          echo "- Digest: \`${hub_digest}\`"
          echo "- Pin: \`${hub_image}:${VERSION_TAG}@${hub_digest}\`"
          echo ""
          echo "#### GitHub Container Registry"
          echo ""
          echo "- Version tag: \`${ghcr_image}:${VERSION_TAG}\`"
          echo "- Digest: \`${ghcr_digest}\`"
          echo "- Pin: \`${ghcr_image}:${VERSION_TAG}@${ghcr_digest}\`"
          echo ""
          echo "$digest_compare"
        } >> "$GITHUB_STEP_SUMMARY"
